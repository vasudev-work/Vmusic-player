name: Build Vmusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore vz-pixelplay.jks -alias vmusic-key -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass 994273 -keypass 994273 \
            -dname "CN=Vmusic player, OU=Dev, O=Vmusic, L=World, S=World, C=US"

      - name: Create keystore.properties
        run: |
          echo "storePassword=994273" > keystore.properties
          echo "keyAlias=vmusic-key" >> keystore.properties
          echo "keyPassword=994273" >> keystore.properties

      - name: Build universal release APK
        run: gradle :app:assembleRelease -Ppixelplay.enableAbiSplits=false

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Vmusic-player-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
